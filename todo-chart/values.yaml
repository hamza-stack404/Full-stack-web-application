namespace: todo-app

frontend:
  replicaCount: 2
  image:
    name: todo-frontend
    tag: latest
    pullPolicy: IfNotPresent  # Use 'Always' for production with registry
  port: 3000
  service:
    type: NodePort
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  health:
    path: /
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

backend:
  replicaCount: 2
  image:
    name: todo-backend
    tag: latest
    pullPolicy: IfNotPresent  # Use 'Always' for production with registry
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 500m
      memory: 512Mi
  health:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

