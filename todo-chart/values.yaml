# Ingress configuration (optional - for production deployments)
ingress:
  enabled: false  # Set to true to enable Ingress
  className: nginx  # Use 'nginx', 'traefik', or your ingress controller
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod  # For automatic TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: todo-app.example.com  # Replace with your domain
  tls:
    - secretName: todo-app-tls
      hosts:
        - todo-app.example.com  # Replace with your domain