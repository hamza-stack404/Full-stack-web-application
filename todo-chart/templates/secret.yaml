apiVersion: v1
kind: Secret
metadata:
  name: todo-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "todo.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.secrets.databaseUrl }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.betterAuthSecret }}